name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: G1 compile
        run: python -m compileall -q youtube3 samples tests
      - name: G2 lint
        run: ruff check
      - name: G3 unit tests
        run: pytest -q
      - name: G4 package
        run: |
          python -m build --outdir "$RUNNER_TEMP/dist"
          twine check --strict "$RUNNER_TEMP"/dist/*
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install -q "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP" && wheel-venv/bin/python -c "import youtube3; print(youtube3.YoutubeClient)"
