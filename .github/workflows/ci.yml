name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.14"]
        include:
          # The token file's owner-only ACL is Windows-specific code (#15).
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: G1 compile
        run: python -m compileall -q youtube3 samples tests
      - name: G2 lint
        run: ruff check
      - name: G3 unit tests
        run: pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: G3b page logic
        run: node --test "tests/page/*.test.cjs"
      - name: G4 package
        if: runner.os == 'Linux'
        run: |
          python -m build --outdir "$RUNNER_TEMP/dist"
          twine check --strict "$RUNNER_TEMP"/dist/*
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install -q "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP" && wheel-venv/bin/python -c "import youtube3; print(youtube3.YoutubeClient)"
          # The page's assets must ship in the wheel.
          wheel-venv/bin/python -c "from youtube3 import page; html = page.page_html({'exported_at': None, 'videos': []}); assert 'function selectVideos' in html and '--accent' in html; print('page assets ok')"
          wheel-venv/bin/python -c "from youtube3 import page; html = page.history_html({'summary': {}, 'videos': []}); assert 'function initHistory' in html; print('history assets ok')"
